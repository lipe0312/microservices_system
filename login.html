<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Architecture - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #38bdf8; --accent-hover: #0ea5e9;
            --border: #334155; --success: #10b981; --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .nav-bar { width: 100%; max-width: 480px; display: flex; background: var(--bg-card); padding: 6px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
        .nav-link { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 600; color: var(--text-muted); text-decoration: none; border-radius: 6px; transition: all 0.2s ease; }
        .nav-link.active { background: var(--bg-primary); color: var(--accent); }

        .container { width: 100%; max-width: 480px; background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; }
        input { width: 100%; padding: 12px 16px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        button { width: 100%; padding: 14px; background: var(--accent); color: var(--bg-primary); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; margin-top: 10px; }
        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .alert { padding: 14px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 24px; display: none; }
        .success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .error { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="cadastro.html" class="nav-link">Cadastro</a>
        <a href="login.html" class="nav-link active">Login</a>
        <a href="creditos.html" class="nav-link">Créditos</a>
    </div>

    <div class="container">
        <h1>Cloud Architecture</h1>
        <div class="subtitle">Autenticação de Segurança</div>
        <div id="alert-box" class="alert"></div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="login-email" placeholder="nome@provedor.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button onclick="logar()">Acessar Plataforma</button>
    </div>

    <script>
        async function logar() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('alert-box');

            try {
                const response = await fetch('http://localhost:3001/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    // Armazena os dados da sessão do usuário no navegador real
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.userId);

                    alertBox.innerText = "Login bem-sucedido! Redirecionando para a carteira...";
                    alertBox.className = "alert success";
                    alertBox.style.display = "block";
                    setTimeout(() => window.location.href = 'creditos.html', 1500);
                } else {
                    alertBox.innerText = data.error;
                    alertBox.className = "alert error";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.innerText = 'Erro ao conectar no microsserviço.';
                alertBox.className = "alert error";
                alertBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
